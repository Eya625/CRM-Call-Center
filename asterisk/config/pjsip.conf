
[global]
type=global
endpoint_identifier_order=auth_username,username,ip


; =====================================================
; ================= TRANSPORTS =========================
; =====================================================

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060


; =====================================================
; ================= AGENT WEBRTC =======================
; =====================================================

[agent]
type=auth
auth_type=userpass
username=agent
password=123456

[agent]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[agent-endpoint]
type=endpoint
context=from-internal
disallow=all
allow=opus,ulaw,alaw
auth=agent
aors=agent
transport=transport-ws

; ================= WEBRTC CORE =================
webrtc=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

; ================= ICE / RTP =================
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes

; ================= DTLS =================
media_encryption=dtls
dtls_auto_generate_cert=yes
dtls_verify=fingerprint
dtls_setup=actpass

; ================= IMPORTANT FIX =================
use_avpf=yes

; =====================================================
; ================= SIP TRUNK ==========================
; =====================================================

[trunk-auth]
type=auth
auth_type=userpass
username=obrandcontact
password=obrandcontact996
realm=sippysoft.com

[trunk-aor]
type=aor
contact=sip:sip.tunisip.com


[trunk-endpoint]
type=endpoint
transport=transport-udp
context=from-external
disallow=all
allow=ulaw,alaw
outbound_auth=trunk-auth
aors=trunk-aor
from_user=obrandcontact
from_domain=sip.tunisip.com
callerid=obrandcontact <obrandcontact>    ; ← ajoute ça
send_pai=yes                               ; ← ajoute ça
send_rpid=yes
rpid_immediate=yes
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
outbound_proxy=sip:sip.tunisip.com\;lr


[trunk-identify]
type=identify
endpoint=trunk-endpoint
match=sip.tunisip.com


[trunk-reg]
type=registration
outbound_auth=trunk-auth

server_uri=sip:sip.tunisip.com
client_uri=sip:obrandcontact@sip.tunisip.com

contact_user=obrandcontact

retry_interval=60
forbidden_retry_interval=600
expiration=3600

transport=transport-udp

outbound_proxy=sip:sip.tunisip.com\;lr

[agent-identify]
type=identify
endpoint=agent-endpoint
match=0.0.0.0/0
