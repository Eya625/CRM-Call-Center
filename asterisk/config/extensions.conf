; =====================================================
; ================== GLOBAL ============================
; =====================================================

[globals]
TRUNK=trunk-endpoint


; =====================================================
; =============== APPELS INTERNES ======================
; =====================================================

[from-internal]

; 🔵 APPELS SORTANTS (CRM / agents / dialer)
exten => _X.,1,NoOp(Appel sortant vers ${EXTEN} via SIP trunk)
 same => n,Set(CALLERID(num)=obrandcontact)
 same => n,Set(CALLERID(name)=obrandcontact)
 same => n,Dial(PJSIP/${EXTEN}@trunk-endpoint,60)
 same => n,NoOp(STATUT APPEL: ${DIALSTATUS})
 same => n,Hangup()


; 🔵 AGENT WEBRTC
exten => 1000,1,NoOp(Appel vers agent WebRTC)
 same => n,Dial(PJSIP/agent-endpoint,30,r)
 same => n,Hangup()


; =====================================================
; =============== APPELS ENTRANTS ======================
; =====================================================

[from-external]

exten => _X.,1,NoOp(Appel entrant ${EXTEN})
 same => n,Set(CALLERID(name)=Client)
 same => n,Set(CHANNEL(hangup_handler_push)=log-call,s,1)
 same => n,Dial(PJSIP/agent-endpoint,30,r)
 same => n,NoOp(FIN APPEL: ${DIALSTATUS})
 same => n,Hangup()


; =====================================================
; =============== LOG CRM ==============================
; =====================================================

[log-call]
exten => s,1,NoOp(LOG CRM)
 same => n,NoOp(NUM=${CALLERID(num)} | STATUS=${DIALSTATUS})
 same => n,Return()
